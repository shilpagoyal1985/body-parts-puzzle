<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Body Builder Game</title>

<style>
body {
  font-family: Arial;
  margin: 0;
  background: linear-gradient(#e3f2fd, #ffffff);
}

/* Layout */
#container {
  display: flex;
  height: 100vh;
}

/* LEFT PANEL */
#leftPanel {
  width: 25%;
  padding: 15px;
  background: #fff;
  border-right: 2px solid #ddd;
  overflow-y: auto;
}

/* CENTER */
#centerPanel {
  width: 50%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

/* RIGHT */
#rightPanel {
  width: 25%;
  padding: 10px;
  border-left: 2px solid #ddd;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 12px;
  overflow-y: auto;
}

/* Buttons */
button {
  padding: 12px 20px;
  margin: 6px 4px;
  font-size: 16px;
  font-weight: bold;
  border-radius: 10px;
  border: none;
  cursor: pointer;
  background: #2196f3;
  color: white;
  transition: all 0.2s ease;
}

button:hover {
  background: #1976d2;
  transform: scale(1.05);
}

.active-btn {
  background: #4caf50 !important;
}

.secondary-btn {
  background: #607d8b;
}

.secondary-btn:hover {
  background: #455a64;
}

/* Game */
#game {
  width: 350px;
  height: 750px;
  position: relative;
  border: 3px solid #333;
  border-radius: 12px;
  overflow: hidden;
  background: #fff;
}

#reference {
  position: absolute;
  width: 100%;
  height: 100%;
  opacity: 0;
}

/* Zones */
.zone {
  position: absolute;
  width: 100%;
  height: 20%;
  border: 1px dashed #bbb;
}

.correct {
  border: none;
  box-shadow: inset 0 0 20px rgba(0,200,0,0.4);
}

/* Pieces */
#rightPanel img {
  width: 160px;
  border-radius: 10px;
  cursor: pointer;
}

/* Progress */
#progress {
  width: 350px;
  height: 10px;
  background: #ddd;
  margin-bottom: 10px;
}

#bar {
  height: 100%;
  width: 0%;
  background: #4caf50;
}

/* Completion overlay */
#completeScreen {
  display:none;
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  background:rgba(0,0,0,0.7);
  color:#fff;
  font-size:24px;
  align-items:center;
  justify-content:center;
  flex-direction:column;
}

/* Confetti */
#confettiCanvas {
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  pointer-events:none;
}
</style>
</head>

<body>

<canvas id="confettiCanvas"></canvas>

<div id="container">

  <!-- LEFT -->
  <div id="leftPanel">
    <h3>Instructions</h3>
    <p>Build the body from top to bottom.</p>

    <button onclick="setMode('easy')" id="btn-easy">Easy</button>
    <button onclick="setMode('medium')" id="btn-medium">Medium</button>

    <br><br>

    <button class="secondary-btn" onclick="resetGame()">Reset</button>
    <button class="secondary-btn" onclick="toggleHint()">Hint</button>
  </div>

  <!-- CENTER -->
  <div id="centerPanel">
    <h2>Build the Body</h2>
    <div id="progress"><div id="bar"></div></div>

    <div id="game">
      <img id="reference" src="images/full.png">
    </div>
  </div>

  <!-- RIGHT -->
  <div id="rightPanel"></div>

</div>

<div id="completeScreen">
  🎉 Congratulations! 🎉<br><br>
  <button onclick="resetGame()">Play Again</button>
</div>

<audio id="successSound">
  <source src="https://cdn.pixabay.com/audio/2022/03/15/audio_115b9b6b5c.mp3" type="audio/mpeg">
</audio>

<script>
const labels=["Head","Face","Torso","Waist","Legs"];
let mode="easy";
let currentStep=0;
let dragged=null;
const total=5;

let confettiInterval=null;
let confettiParticles=[];

const game=document.getElementById("game");
const pieces=document.getElementById("rightPanel");
const bar=document.getElementById("bar");

/* Mode highlight */
function highlightMode(){
  document.querySelectorAll("button").forEach(b=>b.classList.remove("active-btn"));
  document.getElementById("btn-"+mode).classList.add("active-btn");
}

function setMode(m){
  mode=m;
  resetGame();
  highlightMode();
}

/* Progress */
function updateProgress(){
  bar.style.width=((currentStep/total)*100)+"%";
}

/* Reset */
function resetGame(){

  // stop confetti
  if(confettiInterval){
    clearInterval(confettiInterval);
    confettiInterval=null;
  }

  // clear canvas
  const canvas=document.getElementById("confettiCanvas");
  const ctx=canvas.getContext("2d");
  ctx.clearRect(0,0,canvas.width,canvas.height);

  game.innerHTML='<img id="reference" src="images/full.png" style="opacity:0">';
  pieces.innerHTML="";
  document.getElementById("completeScreen").style.display="none";

  currentStep=0;
  updateProgress();
  init();
}

/* Hint */
function toggleHint(){
  const ref=document.getElementById("reference");
  ref.style.opacity = ref.style.opacity==0 ? 0.2 : 0;
}

/* Init */
function init(){
  for(let i=0;i<total;i++){
    const zone=document.createElement("div");
    zone.className="zone";
    zone.style.top=(i*20)+"%";
    zone.dataset.id=i;

    zone.ondragover=e=>e.preventDefault();
    zone.ondrop=()=>handleDrop(zone);

    game.appendChild(zone);
  }

  shuffle([0,1,2,3,4]).forEach(i=>{
    const img=document.createElement("img");
    img.src=`images/part_${i+1}.png`;
    img.dataset.id=i;
    img.draggable=true;

    img.ondragstart=()=>dragged=img;

    pieces.appendChild(img);
  });
}

/* Drop */
function handleDrop(zone){
  if(!dragged) return;

  const id=parseInt(dragged.dataset.id);
  const zoneId=parseInt(zone.dataset.id);

  let correct=(mode==="easy")
    ?(id===currentStep && zoneId===currentStep)
    :(id===zoneId);

  if(correct){
    zone.appendChild(dragged);
    dragged.style.width="100%";
    dragged.style.height="100%";
    dragged.draggable=false;

    currentStep++;
    updateProgress();

    if(currentStep===total){
      completeGame();
    }
  }

  dragged=null;
}

/* Complete */
function completeGame(){
  document.getElementById("successSound").play();
  startConfetti();

  setTimeout(()=>{
    document.getElementById("completeScreen").style.display="flex";
  },500);
}

/* Confetti FIXED */
function startConfetti(){

  const canvas=document.getElementById("confettiCanvas");
  const ctx=canvas.getContext("2d");

  canvas.width=window.innerWidth;
  canvas.height=window.innerHeight;

  confettiParticles=Array.from({length:120},()=>({
    x:Math.random()*canvas.width,
    y:Math.random()*canvas.height,
    r:Math.random()*5+2
  }));

  if(confettiInterval){
    clearInterval(confettiInterval);
  }

  confettiInterval=setInterval(()=>{
    ctx.clearRect(0,0,canvas.width,canvas.height);

    confettiParticles.forEach(p=>{
      p.y+=3;
      if(p.y>canvas.height) p.y=0;

      ctx.beginPath();
      ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
      ctx.fillStyle=`hsl(${Math.random()*360},100%,50%)`;
      ctx.fill();
    });

  },20);

  // auto stop
  setTimeout(()=>{
    if(confettiInterval){
      clearInterval(confettiInterval);
      confettiInterval=null;
    }
  },3000);
}

/* Shuffle */
function shuffle(arr){
  return arr.sort(()=>Math.random()-0.5);
}

/* Start */
init();
highlightMode();
</script>

</body>
</html>
