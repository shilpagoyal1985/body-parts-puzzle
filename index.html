<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Body Builder Game</title>

<style>
body {
  font-family: Arial;
  margin: 0;
  background: linear-gradient(#e3f2fd, #ffffff);
}

/* Main layout */
#container {
  display: flex;
  height: 100vh;
}

/* Left panel */
#leftPanel {
  width: 25%;
  padding: 15px;
  background: #fff;
  border-right: 2px solid #ddd;
  overflow-y: auto;
}

/* Center game */
#centerPanel {
  width: 50%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
}

/* Right pieces */
#rightPanel {
  width: 25%;
  padding: 10px;
  border-left: 2px solid #ddd;
  display: flex;
  flex-wrap: wrap;
  align-content: flex-start;
  justify-content: center;
}

/* Instructions */
#instructions {
  font-size: 14px;
}

/* Controls */
button {
  padding: 6px 12px;
  margin: 5px 3px;
  cursor: pointer;
  border-radius: 6px;
}

/* Game */
#game {
  width: 350px;
  height: 750px;
  position: relative;
  border: 3px solid #333;
  border-radius: 12px;
  overflow: hidden;
  background: #fff;
}

/* Reference */
#reference {
  position: absolute;
  width: 100%;
  height: 100%;
  opacity: 0.2;
  pointer-events: none;
}

/* Zones */
.zone {
  position: absolute;
  width: 100%;
  height: 20%;
  border: 1px dashed #bbb;
  display: flex;
  align-items: center;
  justify-content: center;
}

.correct {
  border: none;
  box-shadow: inset 0 0 20px rgba(0,200,0,0.4);
}

.active {
  border: 2px solid #2196f3;
}

/* Pieces */
#rightPanel img {
  width: 90px;
  margin: 6px;
  cursor: pointer;
  border-radius: 8px;
}

/* Progress */
#progress {
  width: 350px;
  height: 10px;
  background: #ddd;
  margin-bottom: 10px;
}

#bar {
  height: 100%;
  width: 0%;
  background: #4caf50;
}

/* Completion */
#completeScreen {
  display:none;
  position:fixed;
  top:0; left:0;
  width:100%; height:100%;
  background:rgba(0,0,0,0.7);
  color:#fff;
  font-size:24px;
  align-items:center;
  justify-content:center;
  flex-direction:column;
}
</style>
</head>

<body>

<div id="container">

  <!-- LEFT -->
  <div id="leftPanel">

    <h3>🧩 Instructions</h3>

    <div id="instructions">
      <b>How to Play:</b>
      <ul>
        <li>Select a difficulty mode.</li>
        <li>Drag or tap pieces to place them.</li>
        <li>Complete the body from top to bottom.</li>
      </ul>

      <b>Modes:</b>
      <ul>
        <li><b>Easy:</b> Step-by-step guided learning.</li>
        <li><b>Medium:</b> Place any correct part.</li>
        <li><b>Hard:</b> No hints or voice.</li>
      </ul>
    </div>

    <h4>Controls</h4>

    <button onclick="setMode('easy')" id="btn-easy">Easy</button>
    <button onclick="setMode('medium')" id="btn-medium">Medium</button>
    <button onclick="setMode('hard')" id="btn-hard">Hard</button>
    <br>
    <button onclick="resetGame()">🔄 Reset</button>
    <button onclick="toggleHint()">👁 Hint</button>

  </div>

  <!-- CENTER -->
  <div id="centerPanel">

    <h2>Build the Body</h2>

    <div id="progress"><div id="bar"></div></div>

    <div id="game">
      <img id="reference" src="images/full.png">
    </div>

  </div>

  <!-- RIGHT -->
  <div id="rightPanel"></div>

</div>

<div id="completeScreen">
  🎉 Great Job!<br><br>
  <button onclick="resetGame()">Play Again</button>
</div>

<script>
const labels=["Head","Face","Torso","Waist","Legs"];
let mode="easy";
let currentStep=0;
let dragged=null;
let selectedPiece=null;
const total=5;

const game=document.getElementById("game");
const pieces=document.getElementById("rightPanel");
const bar=document.getElementById("bar");

/* Voice */
let voice=null;
speechSynthesis.onvoiceschanged=()=>{
  const voices=speechSynthesis.getVoices();
  voice=voices.find(v=>v.name.toLowerCase().includes("female"))||voices[0];
};

function speak(text){
  if(mode==="hard") return;
  speechSynthesis.cancel();
  const msg=new SpeechSynthesisUtterance(text);
  msg.voice=voice;
  msg.pitch=1.5;
  msg.rate=0.9;
  speechSynthesis.speak(msg);
}

/* Progress */
function updateProgress(){
  bar.style.width=((currentStep/total)*100)+"%";
}

/* Mode */
function highlightMode(){
  ["easy","medium","hard"].forEach(m=>{
    document.getElementById("btn-"+m).style.background="";
  });
  document.getElementById("btn-"+mode).style.background="#4caf50";
}

function setMode(m){
  mode=m;
  resetGame();
  highlightMode();
}

/* Reset */
function resetGame(){
  game.innerHTML='<img id="reference" src="images/full.png">';
  pieces.innerHTML="";
  document.getElementById("completeScreen").style.display="none";
  currentStep=0;
  updateProgress();
  init();
}

/* Hint */
function toggleHint(){
  const ref=document.getElementById("reference");
  ref.style.opacity=ref.style.opacity==0?0.2:0;
}

/* Init */
function init(){

  for(let i=0;i<total;i++){
    const zone=document.createElement("div");
    zone.className="zone";
    zone.style.top=(i*20)+"%";
    zone.dataset.id=i;

    if(mode!=="hard") zone.innerText=labels[i];
    if(mode==="easy" && i===0) zone.classList.add("active");

    zone.ondragover=e=>e.preventDefault();
    zone.ondrop=()=>handleDrop(zone);

    zone.onclick=()=>{
      if(selectedPiece) handleDrop(zone);
    };

    game.appendChild(zone);
  }

  shuffle([0,1,2,3,4]).forEach(i=>{
    const img=document.createElement("img");
    img.src=`images/part_${i+1}.png`;
    img.dataset.id=i;
    img.draggable=true;

    img.ondragstart=()=>dragged=img;

    img.onclick=()=>{
      selectedPiece=img;
      document.querySelectorAll("#rightPanel img").forEach(el=>el.style.outline="");
      img.style.outline="3px solid #2196f3";
      speak(labels[i]);
    };

    pieces.appendChild(img);
  });

  if(mode==="easy") speak("Start with Head");
}

/* Drop */
function handleDrop(zone){
  let piece=dragged||selectedPiece;
  if(!piece) return;

  const id=parseInt(piece.dataset.id);
  const zoneId=parseInt(zone.dataset.id);

  let correct=(mode==="easy")
    ?(id===currentStep && zoneId===currentStep)
    :(id===zoneId);

  if(correct){
    zone.innerHTML="";
    zone.appendChild(piece);
    piece.style.width="100%";
    piece.style.height="100%";
    piece.draggable=false;

    zone.classList.add("correct");
    speak(labels[id]);

    currentStep++;
    updateProgress();

    if(mode==="easy" && currentStep<total){
      document.querySelectorAll(".zone")[currentStep].classList.add("active");
    }

    if(currentStep===total){
      setTimeout(()=>{
        speak("Excellent!");
        document.getElementById("completeScreen").style.display="flex";
      },300);
    }

  } else {
    zone.style.background="rgba(255,0,0,0.2)";
    speak("Try again");
    setTimeout(()=>zone.style.background="",400);
  }

  dragged=null;
  selectedPiece=null;
}

/* Shuffle */
function shuffle(arr){
  return arr.sort(()=>Math.random()-0.5);
}

/* Start */
init();
highlightMode();
</script>

</body>
</html>
